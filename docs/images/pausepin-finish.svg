<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title description">
  <title id="title">Finish on your terms. — Pausepin example</title>
  <desc id="description">Completion records your decision. Pausepin does not run tests. Fictional demo account and project. Commands and output come from an isolated Pausepin session.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#152632"/>
      <stop offset="1" stop-color="#0b1119"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="700" rx="22" fill="url(#canvas)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="42" font-size="16" letter-spacing="2" fill="#7bdcf5">PAUSEPIN / EXAMPLE SESSION</text>
    <text x="40" y="94" font-size="42" font-weight="700" fill="#dce5ef">03  Finish on your terms.</text>
    <text x="40" y="131" font-size="20" fill="#93a7ba">Completion records your decision. Pausepin does not run tests.</text>
  </g>
  <rect x="32" y="164" width="1216" height="468" rx="14" fill="#101820" stroke="#344958"/>
  <path d="M46 164 H1234 Q1248 164 1248 178 V212 H32 V178 Q32 164 46 164Z" fill="#1c2934"/>
  <circle cx="58" cy="188" r="6" fill="#e98484"/>
  <circle cx="80" cy="188" r="6" fill="#dfc178"/>
  <circle cx="102" cy="188" r="6" fill="#94c791"/>
  <text x="640" y="194" text-anchor="middle" fill="#93a7ba" font-family="Arial, Helvetica, sans-serif" font-size="16">demo@laptop — weather-widget</text>
  <g font-family="'DejaVu Sans Mono', 'Liberation Mono', Menlo, Consolas, monospace" font-size="22">
    <text x="64" y="242" xml:space="preserve"><tspan fill="#93a7ba" font-weight="400">demo@laptop ~/projects/weather-widget</tspan></text>
    <text x="64" y="273" xml:space="preserve"><tspan fill="#dce5ef" font-weight="400">$ pausepin ideas</tspan></text>
    <text x="64" y="311" xml:space="preserve"><tspan fill="#dca5f2" font-weight="400">1.</tspan><tspan fill="#dce5ef" font-weight="400"> Add keyboard shortcuts</tspan></text>
    <text x="64" y="364" xml:space="preserve"><tspan fill="#93a7ba" font-weight="400">demo@laptop ~/projects/weather-widget</tspan></text>
    <text x="64" y="395" xml:space="preserve"><tspan fill="#dce5ef" font-weight="400">$ pausepin done</tspan></text>
    <text x="64" y="433" xml:space="preserve"><tspan fill="#ade49a" font-weight="400">Completed by you:</tspan><tspan fill="#dce5ef" font-weight="400"> Handle an empty forecast</tspan></text>
    <text x="64" y="464" xml:space="preserve"><tspan fill="#dce5ef" font-weight="400">No tests were run or verified by Pausepin. Your checkpoints and ideas are retained.</tspan></text>
    <text x="64" y="517" xml:space="preserve"><tspan fill="#93a7ba" font-weight="400">demo@laptop ~/projects/weather-widget</tspan></text>
    <text x="64" y="548" xml:space="preserve"><tspan fill="#dce5ef" font-weight="400">$ pausepin status</tspan></text>
    <text x="64" y="586" xml:space="preserve"><tspan fill="#dce5ef" font-weight="400">No unfinished task here. Run </tspan><tspan fill="#7bdcf5" font-weight="700">pausepin start</tspan><tspan fill="#dce5ef" font-weight="400"> to begin.</tspan></text>
  </g>
  <text x="40" y="672" fill="#93a7ba" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1">FICTIONAL DEMO · NO PERSONAL FILES OR DATA</text>
</svg>

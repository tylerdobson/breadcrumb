<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="673" viewBox="0 0 1280 673" role="img" aria-labelledby="title description">
  <title id="title">Come back with context. — Pausepin example</title>
  <desc id="description">The fictional forecast file changed after the checkpoint. Fictional demo account and project. Commands and output come from an isolated Pausepin session.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#152632"/>
      <stop offset="1" stop-color="#0b1119"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="673" rx="22" fill="url(#canvas)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="42" font-size="16" letter-spacing="2" fill="#7bdcf5">PAUSEPIN / EXAMPLE SESSION</text>
    <text x="40" y="94" font-size="42" font-weight="700" fill="#dce5ef">02  Come back with context.</text>
    <text x="40" y="131" font-size="20" fill="#93a7ba">The fictional forecast file changed after the checkpoint.</text>
  </g>
  <rect x="32" y="164" width="1216" height="441" rx="14" fill="#101820" stroke="#344958"/>
  <path d="M46 164 H1234 Q1248 164 1248 178 V212 H32 V178 Q32 164 46 164Z" fill="#1c2934"/>
  <circle cx="58" cy="188" r="6" fill="#e98484"/>
  <circle cx="80" cy="188" r="6" fill="#dfc178"/>
  <circle cx="102" cy="188" r="6" fill="#94c791"/>
  <text x="640" y="194" text-anchor="middle" fill="#93a7ba" font-family="Arial, Helvetica, sans-serif" font-size="16">demo@laptop — weather-widget</text>
  <g font-family="'DejaVu Sans Mono', 'Liberation Mono', Menlo, Consolas, monospace" font-size="22">
    <text x="64" y="242" xml:space="preserve"><tspan fill="#93a7ba" font-weight="400">demo@laptop ~/projects/weather-widget</tspan></text>
    <text x="64" y="273" xml:space="preserve"><tspan fill="#dce5ef" font-weight="400">$ pausepin resume</tspan></text>
    <text x="64" y="311" xml:space="preserve"><tspan fill="#7bdcf5" font-weight="700">Goal:</tspan><tspan fill="#dce5ef" font-weight="400"> Handle an empty forecast</tspan></text>
    <text x="64" y="342" xml:space="preserve"><tspan fill="#ade49a" font-weight="700">Next: Check the empty-response branch</tspan></text>
    <text x="64" y="373" xml:space="preserve"><tspan fill="#dce5ef" font-weight="700">Done when:</tspan><tspan fill="#dce5ef" font-weight="400"> Empty-state test passes</tspan></text>
    <text x="64" y="404" xml:space="preserve"><tspan fill="#dce5ef" font-weight="700">Your note:</tspan><tspan fill="#dce5ef" font-weight="400"> Empty response skips the fallback</tspan></text>
    <text x="64" y="435" xml:space="preserve"><tspan fill="#f5d17a" font-weight="400">Open decision:</tspan><tspan fill="#dce5ef" font-weight="400"> Retry or show cached weather?</tspan></text>
    <text x="64" y="466" xml:space="preserve"><tspan fill="#dce5ef" font-weight="400">Checkpoint: 2030-04-18T14:32:00.000Z</tspan></text>
    <text x="64" y="497" xml:space="preserve"><tspan fill="#dce5ef" font-weight="400">Git: main · 1 changed file(s)</tspan></text>
    <text x="64" y="528" xml:space="preserve"><tspan fill="#f5d17a" font-weight="400">Changed since checkpoint. Recheck your saved hypothesis before continuing.</tspan></text>
    <text x="64" y="559" xml:space="preserve"><tspan fill="#dce5ef" font-weight="400">Verification: not recorded.</tspan></text>
  </g>
  <text x="40" y="645" fill="#93a7ba" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1">FICTIONAL DEMO · NO PERSONAL FILES OR DATA</text>
</svg>
